extends: existence
message: "§2: '%s' is outside the force vocabulary. If it states obligation, permission, or preference, write the force word (MUST, NEVER, SHOULD, MAY, PREFER X OVER Y). If it does not, leave it."
level: suggestion
tokens:
  - should
  - shall
  - may
  - '[Pp]refer'
  - required\s+to
  - needs?\s+to
  - ha(?:ve|s)\s+to
  - ought\s+to
