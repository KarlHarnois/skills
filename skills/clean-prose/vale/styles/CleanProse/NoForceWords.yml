extends: existence
message: "§2: '%s' states no force. Write a force word, or a Conditional sentence if the force is conditional."
level: error
ignorecase: true
tokens:
  - consider
  - try\s+to
  - it(?:\s+is|['’]s)\s+a\s+good\s+idea\s+to
  - generally
  - usually
  - '(?:if|when|where|as)\s+(?:needed|necessary|appropriate|applicable)(?![\w-]|\s+\w)'
  - '(?:if|when|where)\s+possible(?![\w-]|\s+\w)'
  - might\s+want\s+to
  - feel\s+free\s+to
  - ideally
