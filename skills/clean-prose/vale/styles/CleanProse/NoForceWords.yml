extends: existence
message: "§2: '%s' states no force. Write a force word, or a Conditional sentence if the force is conditional."
level: error
ignorecase: true
tokens:
  - consider
  - try\s+to
  - it\s+is\s+a\s+good\s+idea\s+to
  - generally
  - usually
  - 'where\s+appropriate(?![\w-]|\s+\w)'
  - 'as\s+appropriate(?![\w-]|\s+\w)'
  - 'when\s+appropriate(?![\w-]|\s+\w)'
  - 'as\s+needed(?![\w-]|\s+\w)'
  - 'if\s+needed(?![\w-]|\s+\w)'
  - 'if\s+necessary(?![\w-]|\s+\w)'
  - 'if\s+possible(?![\w-]|\s+\w)'
  - 'where\s+possible(?![\w-]|\s+\w)'
  - might\s+want\s+to
  - feel\s+free\s+to
  - ideally
