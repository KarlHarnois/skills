extends: script
message: "§3: CommonMark joins the lists on both sides of this blank line into one list. Put a paragraph between the lists, or delete the blank line."
level: warning
scope: raw
script: |
  text := import("text")

  bullet_item := text.re_compile("^( *)([-*+])(?:[ \t]|$)")
  ordered_item := text.re_compile("^( *)([0-9]{1,9})([.)])(?:[ \t]|$)")
  fence_opener := text.re_compile("^ *(```+|~~~+)")
  front_matter_delimiter := text.re_compile("^---[ \t\r]*$")
  blank := text.re_compile("^[ \t\r]*$")

  front_matter_length := func(raw_lines) {
    if !front_matter_delimiter.match(raw_lines[0]) { return 0 }
    for i := 1; i < len(raw_lines); i++ {
      if front_matter_delimiter.match(raw_lines[i]) { return i + 1 }
    }
    return 0
  }

  fence_closer := func(line) {
    opener := fence_opener.find(line)
    if is_undefined(opener) { return undefined }
    fence := opener[0][1].text
    return text.re_compile("^ *" + fence + text.substr(fence, 0, 1) + "*[ \t\r]*$")
  }

  skipped_flags := func(raw_lines) {
    flags := []
    front_matter := front_matter_length(raw_lines)
    closer := undefined
    for i, line in raw_lines {
      in_fence := !is_undefined(closer)
      if in_fence && closer.match(line) { closer = undefined }
      if !in_fence && i >= front_matter { closer = fence_closer(line) }
      flags = append(flags, i < front_matter || in_fence || !is_undefined(closer))
    }
    return flags
  }

  indent_of := func(line) {
    return len(line) - len(text.trim_left(line, " "))
  }

  parse_bullet := func(line) {
    found := bullet_item.find(line)
    if is_undefined(found) { return undefined }
    groups := found[0]
    return {kind: "item", indent: len(groups[1].text), marker: groups[2].text, number: undefined}
  }

  parse_ordered := func(line) {
    found := ordered_item.find(line)
    if is_undefined(found) { return undefined }
    groups := found[0]
    return {kind: "item", indent: len(groups[1].text), marker: groups[3].text, number: text.atoi(groups[2].text)}
  }

  parse_item := func(line) {
    bullet := parse_bullet(line)
    return is_undefined(bullet) ? parse_ordered(line) : bullet
  }

  classify := func(line, skipped) {
    if blank.match(line) { return {kind: "blank", indent: 0} }
    item := skipped ? undefined : parse_item(line)
    if !is_undefined(item) { return item }
    return {kind: "other", indent: indent_of(line)}
  }

  parse_lines := func(raw) {
    raw_lines := text.split(raw, "\n")
    skipped := skipped_flags(raw_lines)
    lines := []
    begin := 0
    for i, raw_line in raw_lines {
      line := classify(raw_line, skipped[i])
      line.skipped = skipped[i]
      line.begin = begin
      line.end = begin + len(raw_line) + 1
      lines = append(lines, line)
      begin = line.end
    }
    return lines
  }

  run_items := func(lines, start, step, indent) {
    items := []
    for i := start; i >= 0 && i < len(lines); i += step {
      line := lines[i]
      if line.kind == "blank" || line.indent < indent { break }
      if line.indent > indent { continue }
      if line.kind != "item" { break }
      items = append(items, line)
    }
    return items
  }

  next_nonblank := func(lines, start) {
    for i := start; i < len(lines); i++ {
      if lines[i].kind != "blank" { return i }
    }
    return -1
  }

  opens_gap := func(lines, i) {
    return lines[i].kind == "blank" && !lines[i].skipped && lines[i - 1].kind != "blank"
  }

  joins_runs := func(before, after) {
    if len(before) == 0 || before[0].marker != after[0].marker { return false }
    if len(before) < 2 && len(after) < 2 { return false }
    return is_undefined(after[0].number) || after[0].number == 1
  }

  joins_runs_at := func(lines, gap) {
    next := next_nonblank(lines, gap)
    if next < 0 || lines[next].kind != "item" { return false }
    indent := lines[next].indent
    return joins_runs(run_items(lines, gap - 1, -1, indent), run_items(lines, next, 1, indent))
  }

  matches := []
  lines := parse_lines(scope)
  for gap := 1; gap < len(lines); gap++ {
    if opens_gap(lines, gap) && joins_runs_at(lines, gap) {
      matches = append(matches, {begin: lines[gap].begin, end: lines[gap].end})
    }
  }
