extends: existence
message: "§2: '%s' states no force. If the force is conditional, write a Conditional sentence. Otherwise, write a force word."
level: error
ignorecase: true
tokens:
  - consider
  - try\s+to
  - it(?:\s+is|['’]s)\s+a\s+good\s+idea\s+to
  - generally
  - usually
  - '(?:if|when(?:ever)?|where(?:ver)?|as)\s+(?:needed|necessary|appropriate|applicable)(?![\w-]|\s+\w)'
  - '(?:if|when(?:ever)?|where(?:ver)?)\s+possible(?![\w-]|\s+\w)'
  - might\s+want\s+to
  - feel\s+free\s+to
  - ideally
