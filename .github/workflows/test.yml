name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: make test
      - run: npm install --global @anthropic-ai/claude-code@2.1.309
      - run: make validate
